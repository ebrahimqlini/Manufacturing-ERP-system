{% extends "base.html" %}
{% block title %}عكس حركة{% endblock %}
{% block content %}<h1 class="h3">عكس الحركة {{ movement.reference }}</h1><p>سيُنشأ قيد معاكس جديد، وستبقى الحركة الأصلية محفوظة.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card card-body">{% csrf_token %}<label class="form-label" for="reference">مرجع فريد للعكس</label><input class="form-control mb-3" id="reference" name="reference" required maxlength="100"><label class="form-label" for="reason">سبب العكس</label><textarea class="form-control mb-3" id="reason" name="reason" required maxlength="240"></textarea><button class="btn btn-danger">تسجيل العكس</button></form>{% endblock %}
