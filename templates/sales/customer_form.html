{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ title }}</h1>
<form method="post" class="card card-body gap-3">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="d-flex gap-2">
    <button class="btn btn-primary">حفظ</button>
    {% if customer %}<a class="btn btn-outline-secondary" href="{% url 'sales:customer_detail' customer.pk %}">رجوع</a>{% else %}<a class="btn btn-outline-secondary" href="{% url 'sales:customer_list' %}">رجوع</a>{% endif %}
  </div>
</form>
{% endblock %}
